<!doctype html>
<html data-theme="{{ settings.theme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}storyindex{% endblock %}</title>
<style>
  :root[data-theme="dark"] {
    --bg: #1b1e24;
    --bg-alt: #23272f;
    --fg: #e7e9ec;
    --fg-muted: #a7adb8;
    --border: #363c47;
    --link: #7fb2ff;
    --link-visited: #b39ddb;
    --accent: #4d8fdd;
    --danger: #ff8a80;
    --pill-bg: #2c313b;
    --input-bg: #262b33;
    --input-fg: #e7e9ec;
    --input-border: #454c58;
  }
  :root[data-theme="light"] {
    --bg: #ffffff;
    --bg-alt: #f4f6f8;
    --fg: #1c1f24;
    --fg-muted: #5b6270;
    --border: #dde1e6;
    --link: #1a5fb4;
    --link-visited: #6a3fa0;
    --accent: #1a5fb4;
    --danger: #a00;
    --pill-bg: #eef2f7;
    --input-bg: #ffffff;
    --input-fg: #1c1f24;
    --input-border: #c7ccd3;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    font-size: 17px;
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
    background: var(--bg);
    color: var(--fg);
  }
  a { color: var(--link); text-decoration: none; }
  a:visited { color: var(--link-visited); }
  a:hover { text-decoration: underline; }
  nav { margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0; }
  nav a { margin-right: 1rem; font-weight: 600; }
  nav .spacer { flex: 1; }
  nav .lib-link { font-weight: 400; color: var(--fg-muted); }
  nav details { position: relative; margin-right: 1rem; }
  nav details > summary { cursor: pointer; font-weight: 600; list-style: none; color: var(--fg); }
  nav details > summary::-webkit-details-marker { display: none; }
  nav details[open] > summary { color: var(--accent); }
  nav .nav-menu { position: absolute; top: 100%; left: 0; background: var(--bg-alt); border: 1px solid var(--border); border-radius: 6px; padding: 0.35rem; margin-top: 0.4rem; display: flex; flex-direction: column; min-width: 11rem; z-index: 10; }
  nav .nav-menu a { margin: 0; padding: 0.35rem 0.5rem; font-weight: 400; border-radius: 4px; white-space: nowrap; }
  nav .nav-menu a:hover { background: var(--pill-bg); text-decoration: none; }
  .tag-pill { display: inline-block; background: var(--pill-bg); border-radius: 999px; padding: 0.15rem 0.7rem; margin: 0.15rem; font-size: 0.9rem; }
  .tag-pill form { display: inline; }
  .tag-pill button { border: none; background: none; color: var(--danger); cursor: pointer; margin-left: 0.3rem; }
  .story-list li { margin-bottom: 0.4rem; }
  .review-item { border-bottom: 1px solid var(--border); padding: 0.75rem 0; }
  .review-item h3 { margin-bottom: 0.1rem; }
  .review-item button { font-size: 0.9rem; padding: 0.25rem 0.6rem; }
  .review-item summary { cursor: pointer; margin-bottom: 0.4rem; }
  .story-body { white-space: pre-wrap; line-height: 1.6; margin-top: 1.5rem; }
  input[type=text], input[type=number], input[type=password], textarea, select {
    padding: 0.4rem;
    width: 60%;
    background: var(--input-bg);
    color: var(--input-fg);
    border: 1px solid var(--input-border);
    border-radius: 4px;
    font-size: 1rem;
    font-family: inherit;
  }
  button, input[type=submit] {
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    background: var(--bg-alt);
    color: var(--fg);
    border: 1px solid var(--input-border);
    border-radius: 4px;
    font-size: 1rem;
  }
  button:hover, input[type=submit]:hover { border-color: var(--accent); }
  .muted { color: var(--fg-muted); font-size: 0.92rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 0.4rem; border-bottom: 1px solid var(--border); }
  code, pre { background: var(--bg-alt); border-radius: 4px; }
  code { padding: 0.1rem 0.3rem; }
  pre { padding: 0.6rem; }
  .snippet { color: var(--fg-muted); font-size: 0.92rem; margin: 0.1rem 0 0.3rem; }
  .snippet mark { background: var(--accent); color: var(--bg); border-radius: 2px; }
</style>
</head>
<body>
<nav>
  <a href="{{ url_for('index') }}">browse</a>
  <a href="{{ url_for('prompts_list') }}">prompts</a>
  <a href="{{ url_for('jobs_list') }}">jobs</a>
  <a href="{{ url_for('scheduler_status') }}">scheduler</a>
  <a href="{{ url_for('review_queue') }}">results</a>
  <details>
    <summary>manage ▾</summary>
    <div class="nav-menu">
      <a href="{{ url_for('tags_admin') }}">tags</a>
      <a href="{{ url_for('new_story') }}">add a story</a>
      <a href="{{ url_for('removed_stories') }}">removed stories</a>
      <a href="{{ url_for('libraries_list') }}">libraries</a>
      <a href="{{ url_for('ollama_status') }}">ollama</a>
      <a href="{{ url_for('settings_page') }}">settings</a>
    </div>
  </details>
  <span class="spacer"></span>
  <a href="{{ url_for('libraries_list') }}" class="lib-link">library: {{ current_library or '(none)' }}</a>
</nav>
{% block content %}{% endblock %}
<script>
// Wires a text <input> to a <datalist>, live-populated from
// /tags/autocomplete.json as the user types - keeps tag pickers usable
// with hundreds/thousands of tags instead of dumping every tag name into
// the page at once. Debounced; ignores stale responses that resolve after
// a newer keystroke.
function attachTagAutocomplete(inputId, datalistId) {
  var input = document.getElementById(inputId);
  var datalist = document.getElementById(datalistId);
  if (!input || !datalist) return;
  var timer = null;
  var seq = 0;
  input.addEventListener("input", function () {
    var q = input.value.trim();
    clearTimeout(timer);
    if (!q) { datalist.innerHTML = ""; return; }
    var mySeq = ++seq;
    timer = setTimeout(function () {
      fetch("{{ url_for('tags_autocomplete') }}?q=" + encodeURIComponent(q))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (mySeq !== seq) return;
          datalist.innerHTML = "";
          (data.tags || []).forEach(function (t) {
            var opt = document.createElement("option");
            opt.value = t.name;
            datalist.appendChild(opt);
          });
        });
    }, 150);
  });
}
</script>
</body>
</html>
